name: Japan Test Cycle

on:
  schedule:
    - cron: "0 0 * * 3"   # every Wednesday 00:00 UTC (09:00 JST)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIALPAD_EMAIL: ${{ secrets.DIALPAD_EMAIL }}
      DIALPAD_PASSWORD: ${{ secrets.DIALPAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg xvfb

      - name: Write credentials
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -n "$CREDENTIALS_JSON" ]; then
            printf '%s' "$CREDENTIALS_JSON" > credentials.json
            python -c "import json; json.load(open('credentials.json'))"
          elif [ -z "$DIALPAD_EMAIL" ] || [ -z "$DIALPAD_PASSWORD" ]; then
            echo "::error::Set secret CREDENTIALS_JSON, or both DIALPAD_EMAIL and DIALPAD_PASSWORD"
            exit 1
          fi

      # pytest.ini uses --headed, so run under a virtual display.
      # Transcription summary test depends on the call test, so keep file order.
      - name: Run tests
        run: xvfb-run -a pytest -p no:randomly

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
