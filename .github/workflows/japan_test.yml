name: Japan Test Cycle

on:
  schedule:
    - cron: "0 0 * * 3"   # every Wednesday 00:00 UTC (09:00 JST)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg xvfb

      - name: Write credentials
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDENTIALS_JSON" ]; then
            echo "::error::Secret CREDENTIALS_JSON is empty or not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          printf '%s' "$CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json'))"

      # pytest.ini uses --headed, so run under a virtual display.
      # Transcription summary test depends on the call test, so keep file order.
      - name: Run tests
        run: xvfb-run -a pytest -p no:randomly --timeout=600 --reruns 1 --reruns-delay 5 --junitxml=report.xml --tracing=retain-on-failure

      - name: Test report
        if: always()
        run: python scripts/report.py report.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.xml
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore
